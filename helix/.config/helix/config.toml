# theme = "peachpuff"
theme = "catppuccin_mocha"

[keys.normal]
# H/L 跳到行首/行尾
A-j = "page_cursor_half_down"
A-k = "page_cursor_half_up"

[keys.insert]
j = { j = "normal_mode" }

[editor]
bufferline = "multiple"
line-number = "relative"
mouse = false
end-of-line-diagnostics = "hint"

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.soft-wrap]
enable = true

[editor.cursor-shape]
insert = "bar"

[editor.auto-save]
focus-lost = true

# [editor.indent-guides]
# render = true
# character = "╎" # Some characters that work well: "▏", "┆", "┊", "⸽"
# skip-levels = 1
