[[language]]
name = "markdown"
language-servers = [ "markdown-oxide" ]


[[language]]
name = "go"
language-servers = [ "gopls" ]

[language-server.gopls]
command = "gopls"
args = ["-logfile=/tmp/gopls.log",  "serve"]
"config.ui.diagnostic.staticcheck" = true


[[language]]
name = "typst"
language-servers = ["tinymist"]

[language-server.tinymist]
command = "tinymist"
